name: Conventions

on:
  pull_request:
    branches: [develop, main]
    types: [opened, edited, synchronize, reopened]

jobs:
  branch-name:
    name: Branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch follows type/short-description
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          pattern='^(feat|fix|chore|docs|refactor|test|ci|perf|style|build|release|hotfix)/[a-z0-9][a-z0-9.-]*$'
          if [[ "$BRANCH_NAME" == "develop" ]]; then exit 0; fi
          if [[ ! "$BRANCH_NAME" =~ $pattern ]]; then
            echo "Branch '$BRANCH_NAME' must match $pattern"
            exit 1
          fi

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint commit messages
        run: >
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  pull-request-title:
    name: Pull request title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint --verbose
